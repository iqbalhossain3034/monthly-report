<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাসিক অগ্রিম কর্মসূচি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1b2430;
    --paper:#f3f6fb;
    --paper-line:#d8e0ec;
    --green-deep:#123a5e;
    --green-mid:#2f6690;
    --green-soft:#e2ebf5;
    --gold:#b5651d;
    --gold-soft:#f6e6d6;
    --red:#a13d3d;
    --red-soft:#f6e3e0;
    --shadow:0 1px 2px rgba(18,58,94,.07),0 8px 24px rgba(18,58,94,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Bengali','Hind Siliguri','Vrinda','SolaimanLipi',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .app{max-width:min(2000px, 98vw);margin:0 auto;padding:20px 18px 60px;}

  .letterhead{
    display:flex;align-items:center;gap:16px;
    background:linear-gradient(135deg,var(--green-deep),var(--green-mid));
    color:#f4efdf;border-radius:14px;padding:18px 22px;box-shadow:var(--shadow);
  }
  .seal{
    width:52px;height:52px;border-radius:50%;border:2px solid #d8c48e;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:20px;
    color:#f4efdf;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), transparent 60%);
  }
  .letterhead h1{font-family:'Noto Serif Bengali',serif;font-size:19px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;}
  .letterhead p{margin:0;font-size:12.5px;opacity:.85;}

  .tabs{display:flex;gap:6px;margin:18px 0 16px;flex-wrap:wrap;}
  .tab-btn{
    border:1px solid var(--paper-line);background:#fff;color:var(--green-deep);
    padding:9px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;font-weight:600;transition:.15s;
  }
  .tab-btn:hover{border-color:var(--green-mid);}
  .tab-btn.active{background:var(--green-deep);border-color:var(--green-deep);color:#f4efdf;}

  .card{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px;}
  .card h2{font-family:'Noto Serif Bengali',serif;font-size:16px;margin:0 0 14px;color:var(--green-deep);border-bottom:2px solid var(--green-soft);padding-bottom:8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
  label{display:block;font-size:12px;color:#5a5648;margin-bottom:4px;font-weight:600;}
  input[type=text],input[type=number],input[type=month],input[type=date],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--paper-line);border-radius:8px;
    font-family:inherit;font-size:13.5px;background:#fffdf8;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green-mid);outline-offset:1px;}
  .field{margin-bottom:10px;}
  .hint{font-size:11px;color:#8a8471;margin-top:3px;}
  .btn{border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;font-family:inherit;}
  .btn-primary{background:var(--green-deep);color:#f4efdf;}
  .btn-primary:hover{background:var(--green-mid);}
  .btn-gold{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);}
  .btn-gold:hover{background:var(--gold);color:#fff;}
  .btn-success{background:var(--green-soft);color:var(--green-deep);border:1px solid var(--green-deep);}
  .btn-success:hover{background:var(--green-deep);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--paper-line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--green-mid);}
  .btn-danger{background:var(--red-soft);color:var(--red);border:1px solid var(--red);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{border:1px solid var(--paper-line);padding:6px 6px;text-align:center;vertical-align:middle;}
  thead th{background:var(--green-soft);color:var(--green-deep);font-weight:700;font-size:11px;}
  .select-col select{font-size:11.5px;width:100%;}
  .select-col{min-width:90px;}
  .remark-col{min-width:230px;}
  .village-col{min-width:105px;}
  .owner-col{min-width:190px;}
  .block-col{min-width:44px;white-space:nowrap;}

  /* ================= মোবাইল ভিউ =================
     ছোট স্ক্রিনে (৭৬৮px-এর নিচে) শুধু তারিখ, বার, আর ব্লক নং থেকে নির্বাচন পর্যন্ত কলাম দেখানো হয়;
     বাকি কলাম (মৌজা, ইউনিয়ন, ওয়ার্ড নং, গ্রামের নাম, পরিদর্শিত বাড়ি) লুকানো থাকে।
     স্ক্রল করলে টেবিলের হেডার উপরে স্থিতিশীল (sticky) থাকে — শুধু মোবাইলেই, ডেস্কটপে স্বাভাবিক থাকে। */
  @media screen and (max-width:768px), screen and (max-height:500px) and (orientation:landscape){
    .mobile-hide{display:none!important;}
    .mobile-hide-col{display:none;}
    .report-sheet thead th{position:sticky;top:0;z-index:5;}
    .report-sheet table{font-size:10.5px;table-layout:fixed;}
    .report-sheet th,.report-sheet td{padding:4px 3px;}
    .report-sheet colgroup col:nth-child(1){width:12%!important;}
    .report-sheet colgroup col:nth-child(2){width:9%!important;}
    .report-sheet colgroup col:nth-child(12){width:9%!important;}
    .report-sheet colgroup col:nth-child(13){width:19%!important;}
    .report-sheet colgroup col:nth-child(14){width:8%!important;}
    .report-sheet colgroup col:nth-child(15){width:26%!important;}
    .report-sheet colgroup col:nth-child(16){width:15%!important;}
    .select-col{min-width:0;}
    .select-col select{font-size:9.5px;}
    .remark-col{min-width:0;}
    .owner-col{min-width:0;}
    .block-col{min-width:0;}
  }
  tbody tr:nth-child(even){background:#fbf9f2;}
  tbody tr.off-day{background:#c7c7c2!important;}
  tbody tr.off-day td{color:#3a3a36;}
  tbody tr:focus-within{background:#d3e3f7!important;box-shadow:inset 3px 0 0 var(--green-mid);}
  tbody tr:focus-within td{color:var(--green-deep);font-weight:600;}
  tbody tr.active-row{background:#d3e3f7!important;box-shadow:inset 3px 0 0 var(--green-mid);}
  tbody tr.active-row td{color:var(--green-deep);font-weight:600;}
  td select, td input{font-size:12px;padding:5px 4px;min-width:64px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge.ok{background:var(--green-soft);color:var(--green-deep);}
  .badge.pending{background:var(--gold-soft);color:var(--gold);}
  .muted{color:#8a8471;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--green-deep);color:#f4efdf;padding:10px 20px;border-radius:999px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .history-list{display:flex;flex-direction:column;gap:8px;}
  .history-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--paper-line);border-radius:10px;padding:10px 14px;background:#fffdf8;}
  .history-item strong{font-family:'Noto Serif Bengali',serif;}
  .search-box{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;}
  .search-box select{max-width:220px;}
  .empty{text-align:center;color:#8a8471;padding:26px 10px;font-size:13px;}
  .setup-table td{text-align:left;}
  .setup-table th{white-space:nowrap;}
  .footer-note{font-size:11px;color:#8a8471;text-align:center;margin-top:28px;}
  .select-col{background:#f1efe4;border-left:2px dashed #b8ab7e!important;}
  thead th.select-col{background:#e9e2c9;color:#7a6f4a;}
  .report-head{margin-bottom:14px;}
  .report-head-title{font-family:'Noto Serif Bengali',serif;font-size:14px;line-height:1.6;text-align:center;word-break:keep-all;overflow-wrap:normal;white-space:normal;hyphens:none;}
  .report-head-month{font-size:13px;display:inline-block;margin-top:4px;}
  .report-worker{display:flex;justify-content:space-between;gap:20px;font-size:13px;margin-bottom:14px;line-height:1.8;flex-wrap:wrap;}
  .report-note{font-size:11.5px;color:#5a5648;margin:14px 0 20px;}
  .report-sign{font-size:13px;line-height:1.9;text-align:right;}
  .sign-row{display:flex;justify-content:flex-end;align-items:flex-end;gap:4px;}
  .sign-blank{position:relative;display:inline-block;width:170px;border-bottom:1px solid #1b2430;height:16px;}
  .signature-img{display:none;}
  .center-table input{min-width:60px;}
  .print-only{display:none;}
  /* "office" (শুধু দেখা) ভূমিকার জন্য — reportSheet-এর ভেতরে এডিট-উপযোগী কন্ট্রোল (ড্রপডাউন/ইনপুট)
     লুকিয়ে তার বদলে প্রিন্ট-স্টাইল প্লেইন টেক্সট দেখানো হয়, যাতে ভুলবশতও কোনো ডেটা বদলাতে না পারে */
  .report-sheet.viewer-mode .no-print{display:none!important;}
  .report-sheet.viewer-mode .print-only{display:inline!important;}
  td input[type="text"]{width:100%;border:1px solid #d8d2bd;border-radius:5px;padding:3px 6px;font:inherit;background:#fff;}
  @media print{
    @page{ size:A4 portrait; margin:6mm; }
    .tabs,.top-bar,.row-actions,.no-print,.letterhead,.footer-note{display:none!important;}
    body{background:#fff;font-size:9px;}
    .app{max-width:100%;padding:0;}
    .card{box-shadow:none;border:none;padding:0;margin:0;}
    select.no-print{display:none!important;}
    .report-head{margin-bottom:8px;}
    .report-head-title{font-size:12px;line-height:1.35;}
    .report-head-month{font-size:11px;}
    .report-worker{font-size:10.5px;margin-bottom:8px;line-height:1.5;}
    .report-note{font-size:9px;margin:8px 0 12px;}
    .report-sign{font-size:10.5px;line-height:1.5;margin-top:16px;}
    .sign-blank{width:170px;height:14px;}
    .signature-img{display:block!important;position:absolute;left:50%;bottom:0px;transform:translateX(-50%);height:42px;max-width:160px;object-fit:contain;}
    table{font-size:12.5px;table-layout:fixed;width:100%;border:1px solid #000;}
    .toast{display:none!important;}
    /* স্ক্রিনের জন্য নির্ধারিত min-width গুলো প্রিন্টে বাতিল — নাহলে <colgroup>-এর নির্দিষ্ট
       শতাংশ-ভিত্তিক প্রস্থের সাথে সংঘর্ষ বেঁধে কলাম একে অপরের উপর উঠে যায় (ওভারল্যাপ) */
    .select-col,.remark-col,.village-col,.owner-col,.block-col{min-width:0!important;}
    td.remark-col{text-align:center;}
    .table-wrap{border:1.25px solid #000;padding:2px;}
    thead th{font-size:9px;font-weight:400;line-height:1.15;padding:3px 2px;background:#e8e8e8!important;color:#000!important;}
    th,td{padding:3px 4px;line-height:1.25;overflow-wrap:normal;word-break:keep-all;border:0.5px solid #555;vertical-align:middle;}
    tbody tr:nth-child(even):not(.off-day){background:#fff!important;}
    .print-only{display:inline;white-space:normal;overflow-wrap:normal;word-break:keep-all;}
    .muted{color:#000;font-weight:700;}
    td input[type="text"]{border:none;}
    /* যেকোনো "সর্বশেষ নির্বাচিত সারি" সবুজ হাইলাইট প্রিন্ট/PDF-এ কখনোই দেখানো হবে না */
    tbody tr.active-row,tbody tr:focus-within{background:transparent!important;box-shadow:none!important;}
    tbody tr.active-row td,tbody tr:focus-within td{color:inherit!important;font-weight:inherit!important;}
    /* প্রতিটি ঘরের প্রকৃত ফন্ট-সাইজ/wrap (autofitCells) এবং প্রতিটি সারির উচ্চতা (stretchRowsToFillPage)
       আগে থেকে মেপে --fit-size/--fit-wrap/--row-h কাস্টম প্রপার্টি হিসেবে বসানো থাকে; সেট করা না থাকলে যুক্তিসঙ্গত ডিফল্টে ফিরে যাবে */
    tbody td{font-size:var(--fit-size, 12.5px);white-space:var(--fit-wrap, nowrap);}
    tbody tr{height:var(--row-h, auto);}
    /* কলাম-প্রস্থ এখন উপরের <colgroup>-এ নির্ধারিত (গ্রুপ-হেডারসহ সঠিকভাবে কাজ করার জন্য) */
    tbody tr{page-break-inside:avoid;}
    thead{display:table-header-group;}
  }
  /* উপরের @media print রুলের হুবহু প্রতিরূপ, কিন্তু ক্লাস হিসেবে —
     PDF এক্সপোর্টের সময় html2canvas এই ক্লাসটা ব্যবহার করে ঠিক প্রিন্টের মতোই এক-পাতার কম্প্যাক্ট লেআউট ক্যাপচার করে */
  .pdf-export-mode{background:#fff;font-size:9px;}
  .pdf-export-mode .app{max-width:100%;padding:0;}
  .pdf-export-mode .tabs,.pdf-export-mode .top-bar,.pdf-export-mode .row-actions,
  .pdf-export-mode .no-print,.pdf-export-mode .letterhead,.pdf-export-mode .footer-note{display:none!important;}
  .pdf-export-mode .card{box-shadow:none;border:none;padding:0;margin:0;}
  .pdf-export-mode select.no-print{display:none!important;}
  .pdf-export-mode .report-head{margin-bottom:8px;}
  .pdf-export-mode .report-head-title{font-size:12px;line-height:1.35;}
  .pdf-export-mode .report-head-month{font-size:11px;}
  .pdf-export-mode .report-worker{font-size:10.5px;margin-bottom:8px;line-height:1.5;}
  .pdf-export-mode .report-note{font-size:9px;margin:8px 0 12px;}
  .pdf-export-mode .report-sign{font-size:10.5px;line-height:1.5;margin-top:16px;}
  .pdf-export-mode .sign-blank{width:170px;height:14px;}
  .pdf-export-mode .signature-img{display:block!important;position:absolute;left:50%;bottom:0px;transform:translateX(-50%);height:42px;max-width:160px;object-fit:contain;}
  .pdf-export-mode table{font-size:12.5px;table-layout:fixed;width:100%;border:1px solid #000;}
  .pdf-export-mode .toast{display:none!important;}
  .pdf-export-mode .select-col,.pdf-export-mode .remark-col,.pdf-export-mode .village-col,.pdf-export-mode .owner-col,.pdf-export-mode .block-col{min-width:0!important;}
  .pdf-export-mode td.remark-col{text-align:center;}
  .pdf-export-mode .table-wrap{border:1.25px solid #000;padding:2px;}
  .pdf-export-mode thead th{font-size:9px;font-weight:400;line-height:1.15;padding:3px 2px;background:#e8e8e8!important;color:#000!important;}
  .pdf-export-mode th,.pdf-export-mode td{padding:3px 4px;line-height:1.25;overflow-wrap:normal;word-break:keep-all;border:0.15px solid #000;vertical-align:middle;}
  .pdf-export-mode tbody tr:nth-child(even):not(.off-day){background:#fff!important;}
  .pdf-export-mode tbody tr.active-row,.pdf-export-mode tbody tr:focus-within{background:transparent!important;box-shadow:none!important;}
  .pdf-export-mode tbody tr.active-row td,.pdf-export-mode tbody tr:focus-within td{color:inherit!important;font-weight:inherit!important;}
  .pdf-export-mode .print-only{display:inline;white-space:normal;overflow-wrap:normal;word-break:keep-all;}
  .pdf-export-mode .muted{color:#000;font-weight:700;}
  .pdf-export-mode td input[type="text"]{border:none;}
  /* প্রিন্টের মতোই — autofitCells/stretchRowsToFillPage-এর হিসাব এখান থেকেই আসল ফন্ট/উচ্চতা নির্ধারণ করে */
  .pdf-export-mode tbody td{font-size:var(--fit-size, 12.5px);white-space:var(--fit-wrap, nowrap);}
  .pdf-export-mode tbody tr{height:var(--row-h, auto);}
  /* কলাম-প্রস্থ এখন <colgroup>-এ নির্ধারিত */
  /* ================= মোবাইলে PDF ওভারল্যাপ বাগ ফিক্স =================
     সমস্যা: autofitCells()/stretchRowsToFillPage() একটা অফস্ক্রিন ক্লোনের (position:fixed) উপর মাপ নেয়,
     কিন্তু @media screen (max-width:768px) নিয়মটি ভিউপোর্টের প্রস্থ অনুযায়ী সবসময় সক্রিয় থাকে —
     ক্লোনের নিজের width:198mm সেট করা সত্ত্বেও। ফলে মোবাইল ফোনে মাপার সময় "মোবাইল ভিউ"-এর জন্য
     লুকানো কলাম (mobile-hide) ও সংকুচিত কলাম-প্রস্থ (!important) ব্যবহার হয়ে যেত — যেটা আসল
     প্রিন্ট/PDF-এর পূর্ণ ১৫-কলাম লেআউট থেকে সম্পূর্ণ ভিন্ন। এর ফলে ভুল ফন্ট-সাইজ/সারি-উচ্চতা হিসাব
     হয়ে আসল প্রিন্টে লেখা একে অপরের উপর উঠে যেত (ওভারল্যাপ)। নিচের নিয়মগুলো .pdf-export-mode
     ক্লোনের ভেতরে মোবাইল-ভিউয়ের প্রভাব সম্পূর্ণ বাতিল করে সবসময় ডেস্কটপ/প্রিন্ট লেআউট বাধ্য করছে। */
  .pdf-export-mode col.mobile-hide{display:table-column!important;}
  .pdf-export-mode td.mobile-hide,.pdf-export-mode th.mobile-hide{display:table-cell!important;}

function defaultState(){
  return {

    nextRowId: 25,
    nextHolidayId: 49
  };
}

function parseRange(s){
  const m = String(s||'').match(/(\d+)\s*-\s*(\d+)/);
  if(!m) return {from:0,to:0};
  return {from:parseInt(m[1]), to:parseInt(m[2])};
}

// পুরনো সংস্করণের ব্রাউজার-ডেটা (v1/v2, যেখানে কেন্দ্র তালিকা ও ছুটি এডিট করা যেত না)
// থাকলে সেটাকে নতুন কাঠামোতে (v3, সম্পূর্ণ এডিটেবল) রূপান্তর করে — এন্ট্রি/ইতিহাস অক্ষুণ্ণ থাকে
function migrateState(state){
  if(state.version === DATA_VERSION) return state;
  if(!state.worker) state.worker = defaultState().worker;
  if(!state.worker.union) state.worker.union = 'সদাসদী';

  if(!state.centerRows){
    if(state.blocks && state.blocks.length){
      let rows = []; let id=1;
      state.blocks.forEach(b=>{
        const r1=parseRange(b.ipc1), r2=parseRange(b.ipc2), r3=parseRange(b.epi);
        rows.push({id:'c'+(id++), mouzaNo:b.mouzaNo, mouzaName:b.mouzaName, villageName:b.villageName, houseFrom:r1.from, houseTo:r1.to, newC:0, cancelC:0, blockNo:b.code, ownerName:b.ownerName, purpose:'IPC', note:''});
        rows.push({id:'c'+(id++), mouzaNo:b.mouzaNo, mouzaName:b.mouzaName, villageName:b.villageName, houseFrom:r2.from, houseTo:r2.to, newC:0, cancelC:0, blockNo:b.code, ownerName:b.ownerName, purpose:'IPC', note:'A'});
        rows.push({id:'c'+(id++), mouzaNo:b.mouzaNo, mouzaName:b.mouzaName, villageName:b.villageName, houseFrom:r3.from, houseTo:r3.to, newC:0, cancelC:0, blockNo:b.code, ownerName:b.ownerName, purpose:'EPI', note:''});
      });
      state.centerRows = rows;
      state.nextRowId = id;
      delete state.blocks;
    } else {
      state.centerRows = defaultCenterRows();
      state.nextRowId = 25;
    }
  }
  if(!state.holidays){
    state.holidays = defaultHolidays();
    state.nextHolidayId = 49;
  }
  if(state.auth){
    delete state.auth; // পুরনো প্লেইন-টেক্সট পাসওয়ার্ড ডেটা — Firebase Authentication এখন এটা সামলায়, তাই এটা মুছে দেওয়া হচ্ছে
  }
  if(!state.currentMonth){
    state.currentMonth = isoDate(new Date()).slice(0,7);
  }
  if(state.nextRowId===undefined) state.nextRowId = (state.centerRows.length||24)+1;
  if(state.nextHolidayId===undefined) state.nextHolidayId = (state.holidays.length||48)+1;
  state.version = DATA_VERSION;
  return state;
}

let SUPPRESS_NEXT_SNAPSHOT = false; // নিজের করা লেখা নিজেই যেন আবার প্রসেস না করে (পুনরাবৃত্তি এড়াতে)
let fbSyncTimer = null;
let FIREBASE_STATUS = 'connecting'; // 'connecting' | 'online' | 'offline'

function initFirebase(){
  if(!(window.firebase && firebase.initializeApp)){
    setTimeout(initFirebase, 400); // SDK তখনও লোড না হয়ে থাকলে একটু পর আবার চেষ্টা
    return;
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    // লগইন শুধু এই ব্রাউজার ট্যাবের জন্যই মনে রাখা হবে — ট্যাব/ব্রাউজার বন্ধ করলেই স্বয়ংক্রিয়ভাবে লগআউট হয়ে যাবে
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(e=>console.error('persistence set failed', e));
    fbDb = firebase.firestore();
    fbDocRef = fbDb.collection('app_data').doc('shared_state');
    fbReady = true;
    // লগইন/লগআউট অবস্থা বদলালেই এখানে জানা যাবে — Firestore পড়া/লেখা এখন
    // নিরাপত্তা-নিয়ম অনুযায়ী লগইন করা অবস্থাতেই কেবল সম্ভব
    let listening = false;
    firebase.auth().onAuthStateChanged((user)=>{
      AUTH_CHECKED = true;
      if(user){
        const role = roleForEmail(user.email);
        if(role){
          AUTHENTICATED = true;
          CURRENT_ROLE = role;
          if(role==='viewer' && ACTIVE_TAB==='entry') ACTIVE_TAB = 'history';
          if(!listening){ listening = true; listenFirebase(); }
        } else {
          // পরিচিত নয় এমন কোনো ইমেইল দিয়ে সাইন-ইন হয়ে থাকলে (ভুলবশত অন্য অ্যাকাউন্ট) সাথে সাথে সাইন-আউট করে দেওয়া হচ্ছে
          AUTHENTICATED = false; CURRENT_ROLE = null;
          firebase.auth().signOut();
        }
      } else {
        AUTHENTICATED = false; CURRENT_ROLE = null;
      }
      render();
    });
  }catch(e){
    console.error('firebase init failed', e);
    FIREBASE_STATUS = 'offline';
  }
}

function listenFirebase(){
  if(!fbReady) return;
  fbDocRef.onSnapshot((doc)=>{
    FIREBASE_STATUS = 'online';
    if(SUPPRESS_NEXT_SNAPSHOT){ SUPPRESS_NEXT_SNAPSHOT = false; return; }
    if(doc.exists && doc.data() && doc.data().json){
      try{
        STATE = migrateState(JSON.parse(doc.data().json));
        localStorage.setItem(STORAGE_KEY, doc.data().json);
        render();
      }catch(e){ console.error('snapshot parse failed', e); }
    } else {
      // ক্লাউডে এখনো কিছু নেই — শুধু তখনই বর্তমান লোকাল ডেটা পাঠানো হবে যদি সত্যিই কিছু থাকে;
      // একটা একদম খালি ব্রাউজার যেন ভুল করে খালি ডেটা পাঠিয়ে অন্য কারো আসল ডেটা মুছে না দেয়
      const hasRealData = STATE && STATE.entries && Object.keys(STATE.entries).length > 0;
      if(hasRealData) pushToFirebase();
    }
  }, (err)=>{
    console.error('firestore listen failed', err);
    FIREBASE_STATUS = 'offline';
  });
}

function scheduleFirebaseSync(){
  if(!fbReady){ setTimeout(scheduleFirebaseSync, 400); return; } // Firebase তখনও প্রস্তুত না হলে একটু পর আবার চেষ্টা, যেন কোনো সংরক্ষণ হারিয়ে না যায়
  clearTimeout(fbSyncTimer);
  fbSyncTimer = setTimeout(pushToFirebase, 500);
}

async function pushToFirebase(){
  if(!fbReady) return;
  try{
    SUPPRESS_NEXT_SNAPSHOT = true;
    await fbDocRef.set({
      json: JSON.stringify(STATE),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    FIREBASE_STATUS = 'online';
  }catch(e){
    console.error('firebase push failed', e);
    SUPPRESS_NEXT_SNAPSHOT = false;
    FIREBASE_STATUS = 'offline';
  }
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    LAST_SAVE_ERROR = null;
    scheduleFirebaseSync();
    return true;
  }catch(e){
    console.error('save failed', e);
    if(e && e.name==='QuotaExceededError'){
      LAST_SAVE_ERROR = 'ব্রাউজারের সংরক্ষণ জায়গা পূর্ণ হয়ে গেছে (QuotaExceededError) — পুরনো ব্যাকআপ ডাউনলোড করে কিছু ডেটা মুছে ফেলুন';
    } else {
      LAST_SAVE_ERROR = (e && e.message) ? e.message : 'অজানা ত্রুটি';
    }
    return false;
  }
}
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), ms||2200);
}
function holidayMap(){
  const m = {};
  STATE.holidays.forEach(h=>{ if(h.date && !m[h.date]) m[h.date]=h.name; });
  return m;
}
// এই মাসের সব শুক্রবার/ছুটির দিনে মন্তব্য বসানো আছে কিনা — এটা প্রতিবার নতুন করে হিসাব করা হয়
// (কোনো স্থায়ী ফ্ল্যাগ না রেখে), তাই কেউ পরে ছুটি যোগ/মন্তব্য মুছে দিলে এটা নিজে থেকেই ঠিক থাকে
function remarksFullyFilled(ym){
  const entry = getMonthEntry(ym);
  const hMap = holidayMap();
  for(const row of entry.rows){
    const d = new Date(row.date+'T00:00:00');
    const isFriday = d.getDay()===5;
    const holiday = hMap[row.date];
    if((isFriday || holiday) && !row.remark) return false;
  }
  return true;
}

/* ---------------- কেন্দ্র লুকআপ ---------------- */
function centerLabel(r){
  return `${r.blockNo||''}${r.note?(' '+r.note):''} ${r.purpose||''}`.replace(/\s+/g,' ').trim();
}
function categoryList(){
  const set = new Set();
  STATE.centerRows.forEach(r=>{ if(r.purpose) set.add(r.purpose); });
  set.add('IPC'); set.add('EPI');
  const list = [...set].filter(p=>p!=='সি সি সেবা').sort((a,b)=> (a==='IPC'?-2:a==='EPI'?-1:0) - (b==='IPC'?-2:b==='EPI'?-1:0) || a.localeCompare(b));
  list.push('সি সি সেবা');
  return list;
}
function optionsForCategory(cat){
  if(cat==='সি সি সেবা') return ['সি সি সেবা','----'];
  const opts = STATE.centerRows.filter(r=>r.purpose===cat).map(centerLabel);
  opts.push('----');
  return opts;
}
function lookupByCode(code){
  if(!code || code==='----' || code==='সি সি সেবা') return null;
  const row = STATE.centerRows.find(r=>centerLabel(r)===code);
  if(!row) return null;
  const total = (Number(row.houseTo||0)-Number(row.houseFrom||0)+1) + Number(row.newC||0) - Number(row.cancelC||0);
  return {row, total};
}

/* ---------------- মাসের সারি তৈরি ---------------- */
function buildMonthRows(ym, category){
  const [y,m] = ym.split('-').map(Number);
  const n = daysInMonth(y, m-1);
  const rows = [];
  for(let d=1; d<=n; d++){
    const iso = isoDate(new Date(y, m-1, d));
    rows.push({date:iso, code:'', remark:''});
  }
  return {category: category||'IPC', rows};
}
function getMonthEntry(ym){
  if(!STATE.entries[ym]) STATE.entries[ym] = buildMonthRows(ym, 'IPC');
  return STATE.entries[ym];
}

function tabBtn(id,label){ return `<button class="tab-btn ${ACTIVE_TAB===id?'active':''}" onclick="setTab('${id}')">${label}</button>`; }
function setTab(id){
  ACTIVE_TAB=id;
  // "মাসিক রিপোর্ট" ট্যাবে ফিরে এলে সবসময় সংরক্ষিত ডিফল্ট মাসেই (শেষ জমা দেওয়ার পরের মাস) রিসেট হবে —
  // ইতিহাস থেকে অন্য কোনো মাস দেখা/এডিট করার প্রভাব যেন এখানে না থাকে
  if(id==='entry') CURRENT_MONTH = STATE.currentMonth || CURRENT_MONTH;
  render();
}
function renderTab(){
  if(CURRENT_ROLE==='viewer' && (ACTIVE_TAB==='setup' || ACTIVE_TAB==='holidays' || ACTIVE_TAB==='dashboard')) ACTIVE_TAB = 'history';
  const c = document.getElementById('tab-content');
  if(ACTIVE_TAB==='entry') c.innerHTML = entryTabHTML();
  else if(ACTIVE_TAB==='setup') c.innerHTML = setupTabHTML();
  else if(ACTIVE_TAB==='holidays') c.innerHTML = holidaysTabHTML();
  else if(ACTIVE_TAB==='dashboard') c.innerHTML = dashboardTabHTML();
  else c.innerHTML = historyTabHTML();
}

async function updateRow(idx, field, val){

function fillRemarks(){
  const entry = getMonthEntry(CURRENT_MONTH);
  const hMap = holidayMap();
  let count=0;
  entry.rows.forEach(row=>{
    const d = new Date(row.date+'T00:00:00');
    const holiday = hMap[row.date];
    if(holiday && !row.remark){ row.remark = holiday; count++; }
    else if(d.getDay()===5 && !row.remark){ row.remark = 'সাপ্তাহিক ছুটি (শুক্রবার)'; count++; }
  });
  saveState(); renderTab();
  toast(count+' টি সারিতে মন্তব্য বসানো হয়েছে');
}

    return;
  }
  if(!confirm('এই মাসের সব সিলেকশন ও মন্তব্য মুছে ফেলা হবে। আপনি কি নিশ্চিত?')) return;

/* ================= প্রতিটি ঘরের লেখা মেপে প্রয়োজনমতো ফন্ট ছোট করা (এক্সেলের "Shrink to fit") =================
   এই পুরো হিসাবটা স্ক্রিনের বাইরে (অদৃশ্য) একটা কপির উপর করা হয়, তাই আসল পাতায় কোনো
   পরিবর্তন/ফ্লিকার দেখা যায় না — শুধু প্রিন্ট/PDF আউটপুটেই এর প্রভাব পড়ে। */
function buildOffscreenClone(){
  const sheet = document.getElementById('reportSheet');
  if(!sheet) return null;
  const clone = sheet.cloneNode(true);
  clone.removeAttribute('id');
  clone.style.width = '198mm';
  clone.style.maxWidth = '198mm';
  const wrap = document.createElement('div');
  wrap.className = 'pdf-export-mode';
  wrap.style.cssText = 'position:fixed;top:0;left:-10000px;background:#fff;pointer-events:none;';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  return { wrap, clone };
}
function autofitCells(root){
  // ধাপ ১: কলাম ১-১৪ এর সব ঘরের জন্য একটামাত্র অভিন্ন ফন্ট সাইজ বের করা (রো-ভিত্তিতে আলাদা নয়) —
  // এতে প্রতিটি সাধারণ সারির উচ্চতা সমান থাকে, কোনো সারি বাকিগুলোর চেয়ে চিকন/মোটা দেখায় না
  const rows = Array.from(root.querySelectorAll('table tbody tr'));
  const mainCellsByRow = rows.map(row=>Array.from(row.querySelectorAll('td:not(.select-col)')).slice(0,14));
  const allMainCells = mainCellsByRow.flat();
  const MAIN_MAX = 12.5, MAIN_MIN = 6.5;
  let size = MAIN_MAX;
  allMainCells.forEach(td=>{ td.style.whiteSpace='nowrap'; td.style.fontSize=size+'px'; });
  let guard = 0;
  while(allMainCells.some(td=>td.scrollWidth > td.clientWidth) && size > MAIN_MIN && guard < 20){
    size -= 0.5;
    allMainCells.forEach(td=>{ td.style.fontSize = size+'px'; });
    guard++;
  }
  // নিরাপত্তা: সর্বনিম্ন ফন্ট সাইজেও যদি কোনো ঘরের লেখা এখনও না আঁটে (যেমন লম্বা মালিকের নাম),
  // সেটিকে জোর করে এক লাইনে না রেখে দুই লাইনে wrap করতে দেওয়া হচ্ছে — নাহলে পাশের কলামের উপর
  // লেখা উপচে পড়ে (ওভারল্যাপ) দেখায়
  allMainCells.forEach(td=>{
    if(td.scrollWidth > td.clientWidth){ td.style.whiteSpace='normal'; }
  });
  // ধাপ ২: মন্তব্য কলাম — একই অভিন্ন সাইজ দিয়ে চেষ্টা; শুধু যে নির্দিষ্ট সারিতে না আঁটবে,
  // কেবল সেই একটা ঘরই আলাদাভাবে আরেকটু ছোট হবে বা প্রয়োজনে দুই লাইনে যাবে
  const results = [];
  rows.forEach((row,ri)=>{
    const cells = Array.from(row.querySelectorAll('td:not(.select-col)'));
    const rowResult = mainCellsByRow[ri].map(td=>({size, wrapMode: td.style.whiteSpace==='normal' ? 'normal' : 'nowrap'}));
    const remarkTd = cells[14];
    if(remarkTd){
      let rSize = size;
      remarkTd.style.whiteSpace = 'nowrap';
      remarkTd.style.fontSize = rSize + 'px';
      let g = 0;
      while(remarkTd.scrollWidth > remarkTd.clientWidth && rSize > 6.5 && g < 20){
        rSize -= 0.5;
        remarkTd.style.fontSize = rSize + 'px';
        g++;
      }
      let wrapMode = 'nowrap';
      if(remarkTd.scrollWidth > remarkTd.clientWidth){
        wrapMode = 'normal';
        remarkTd.style.whiteSpace = 'normal';
      }
      rowResult.push({size:rSize, wrapMode});
    }
    results.push(rowResult);
  });
  return results;
}
function applyFitResultsToLiveSheet(results){
  const sheet = document.getElementById('reportSheet');
  if(!sheet) return;
  sheet.querySelectorAll('table tbody tr').forEach((row, ri)=>{
    const cells = row.querySelectorAll('td:not(.select-col)');
    const rr = results[ri];
    if(!rr) return;
    cells.forEach((td, i)=>{
      const r = rr[i];
      if(!r) return;
      // কাস্টম প্রপার্টি হিসেবে বসানো হচ্ছে — স্ক্রিনের সাধারণ CSS এগুলো ব্যবহারই করে না,
      // শুধু @media print নিয়মেই এগুলো পড়া হয়, তাই স্ক্রিনে কোনো প্রভাব পড়ে না
      td.style.setProperty('--fit-size', r.size + 'px');
      td.style.setProperty('--fit-wrap', r.wrapMode);
    });
  });
}
function clearFitResultsFromLiveSheet(){
  const sheet = document.getElementById('reportSheet');
  if(!sheet) return;
  sheet.querySelectorAll('table tbody td').forEach(td=>{
    td.style.removeProperty('--fit-size');
    td.style.removeProperty('--fit-wrap');
  });
}
/* পাতার নিচে ফাঁকা জায়গা না রেখে সব সারিকে সমান করে ছড়িয়ে পুরো পাতা ভরে দেওয়া হয় */
function stretchRowsToFillPage(root){
  const table = root.querySelector('table');
  const tbody = root.querySelector('table tbody');
  const thead = root.querySelector('table thead');
  if(!table || !tbody) return [];

  // ব্রাউজারের mm→px রূপান্তর যাচাই করতে একটা অস্থায়ী ক্যালিব্রেশন এলিমেন্ট ব্যবহার হচ্ছে
  const calib = document.createElement('div');
  calib.style.cssText = 'position:fixed;visibility:hidden;height:285mm;width:0;';
  document.body.appendChild(calib);
  const targetTotalPx = calib.getBoundingClientRect().height;
  calib.remove();

  const rootRect = root.getBoundingClientRect();
  const tableRect = table.getBoundingClientRect();
  const nonTableHeight = rootRect.height - tableRect.height; // হেডার+কর্মীর তথ্য+নোট+স্বাক্ষর অংশ
  const theadHeight = thead ? thead.getBoundingClientRect().height : 0;

  const bodyRows = Array.from(tbody.querySelectorAll('tr'));
  const numRows = bodyRows.length;
  if(numRows===0) return [];

  const currentBodyHeight = bodyRows.reduce((sum,tr)=>sum+tr.getBoundingClientRect().height, 0);
  const availableForBody = targetTotalPx - nonTableHeight - theadHeight;
  const extra = availableForBody - currentBodyHeight;
  const heights = [];
  if(extra > 4){
    const perRowExtra = extra / numRows;
    bodyRows.forEach(tr=>{
      const h = tr.getBoundingClientRect().height + perRowExtra;
      tr.style.height = h + 'px';
      heights.push(h);
    });
  } else {
    bodyRows.forEach(tr=>heights.push(tr.getBoundingClientRect().height));
  }
  return heights;
}
function applyRowHeightsToLiveSheet(heights){
  const sheet = document.getElementById('reportSheet');
  if(!sheet) return;
  sheet.querySelectorAll('table tbody tr').forEach((tr,i)=>{
    if(heights[i]!=null) tr.style.setProperty('--row-h', heights[i] + 'px');
  });
}
function clearRowHeightsFromLiveSheet(){
  const sheet = document.getElementById('reportSheet');
  if(!sheet) return;
  sheet.querySelectorAll('table tbody tr').forEach(tr=>tr.style.removeProperty('--row-h'));
}

/* ================= প্রিন্ট (ফাইলের নামসহ) ================= */
/* মোবাইলে (বিশেষত প্রথমবার পেজ খোলার পরপরই) বাংলা ওয়েবফন্ট (Noto Sans/Serif Bengali) ডাউনলোড হয়ে
   পুরোপুরি লোড হওয়ার আগেই প্রিন্ট/PDF স্ন্যাপশট নেওয়া হয়ে যেত — তখন ব্রাউজার সিস্টেমের ডিফল্ট ফন্টে
   ফিরে যায়, যেটাতে বাংলা যুক্তাক্ষর ঠিকভাবে জোড়া লাগে না, ফলে লেখা ভাঙা/ফাঁকা-ফাঁকা দেখায়। তাই প্রিন্টের
   আগে ফন্ট সম্পূর্ণ লোড হওয়া পর্যন্ত অপেক্ষা করা হচ্ছে। */
async function ensureFontsLoaded(){
  if(!(window.document && document.fonts && document.fonts.load)) return;
  try{
    await Promise.all([
      document.fonts.load('400 14px "Noto Serif Bengali"'),
      document.fonts.load('700 14px "Noto Serif Bengali"'),
      document.fonts.load('400 12px "Noto Sans Bengali"'),
      document.fonts.load('600 12px "Noto Sans Bengali"'),
      document.fonts.load('700 12px "Noto Sans Bengali"'),
      document.fonts.ready
    ]);
  }catch(e){ /* ফন্ট লোড ব্যর্থ হলেও প্রিন্ট আটকাবে না */ }
}
async function printReport(){
  const prevTitle = document.title;
  document.title = reportFileBaseName(CURRENT_MONTH);
  await ensureFontsLoaded();
  const off = buildOffscreenClone();
  if(off){
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const results = autofitCells(off.clone);
    applyFitResultsToLiveSheet(results);
    const heights = stretchRowsToFillPage(off.clone);
    applyRowHeightsToLiveSheet(heights);
    off.wrap.remove();
  }
  let restored = false;
  const restore = ()=>{
    if(restored) return;
    restored = true;
    document.title = prevTitle;
    clearFitResultsFromLiveSheet();
    clearRowHeightsFromLiveSheet();
    window.removeEventListener('afterprint', restore);
    document.removeEventListener('visibilitychange', onVisChange);
  };
  // মোবাইলে window.print() একটা সিস্টেম-লেভেল প্রিন্ট/PDF শিট খোলে যেটা অ্যাপকে ব্যাকগ্রাউন্ডে
  // পাঠিয়ে দেয় (visibilitychange -> 'hidden')। ব্যবহারকারী Save as PDF-এর সেটিংস (Copies, Paper
  // size ইত্যাদি) নিয়ে সময় নিলে এটা কয়েক সেকেন্ডের বেশি সময় নিতে পারে। সেই সময়টায় টাইটেল/ফিট যেন
  // আগেভাগেই পুরনো অবস্থায় ফিরে না যায়, তাই এখন restore() শুধু ঘটবে যখন: (ক) 'afterprint' ইভেন্ট
  // আসবে (ডেস্কটপে সাধারণত এটাই আসে ঠিক সময়ে), অথবা (খ) ব্যবহারকারী আবার অ্যাপে ফিরে আসবে
  // (visibilitychange -> 'visible', মোবাইলে এটাই আসল সংকেত — Save/Cancel যাই করুন না কেন)।
  // নিরাপত্তার জন্য একটা অনেক লম্বা (২ মিনিট) ফলব্যাক টাইমআউটও রাখা হয়েছে, যাতে কোনো কারণে
  // দুটো ইভেন্টের একটাও না এলে টাইটেল চিরস্থায়ীভাবে বদলে না থেকে যায়।
  const onVisChange = ()=>{
    if(document.visibilityState === 'visible') restore();
  };
  window.addEventListener('afterprint', restore);
  document.addEventListener('visibilitychange', onVisChange);
  setTimeout(restore, 120000);
  window.print();
}

/* ================= PDF ডাউনলোড (ছবি-ভিত্তিক পদ্ধতি — মোবাইল Chrome-এর বাংলা টেক্সট-বাগ এড়াতে) =================
   সমস্যা: মোবাইল Chrome-এর নিজস্ব "Save as PDF" ইঞ্জিনটির জটিল বাংলা যুক্তাক্ষর/মাত্রা (conjunct)
   PDF-এর টেক্সট-লেয়ারে রূপান্তরের একটা পরিচিত বাগ আছে — প্রতিটি অক্ষর-গুচ্ছ আলাদা আলাদা "শব্দ"
   হিসেবে বসে যায়, ফলে লেখা ভাঙা/ফাঁকা-ফাঁকা দেখায় (ডেস্কটপ Chrome-এ এই বাগ নেই)। এটা CSS/HTML
   দিয়ে ঠিক করা সম্ভব না — এটা ব্রাউজার ইঞ্জিনের নিজস্ব সীমাবদ্ধতা।
   সমাধান: স্ক্রিনে যেভাবে বাংলা একদম সঠিকভাবে রেন্ডার হয় (এখানে কোনো বাগ নেই), সেই একই রেন্ডারিং-এর
   একটা উচ্চ-রেজলিউশন "ছবি" (html2canvas দিয়ে) তুলে সরাসরি PDF-এ বসিয়ে দেওয়া হয় (jsPDF দিয়ে)।
   এতে ব্রাউজারের বাগি PDF-টেক্সট-ইঞ্জিন আর ব্যবহার হয় না বলে লেখা ভাঙার কোনো সুযোগই থাকে না,
   এবং ফাইলের নামও এখানেই সরাসরি নির্ধারণ করা যায় (কোনো টাইমিং সমস্যা ছাড়াই)। */
async function downloadPDFViaImage(){
  if(!document.getElementById('reportSheet')) return;
  if(!(window.html2canvas && window.jspdf)){
    toast('⚠ PDF তৈরির লাইব্রেরি লোড হয়নি — ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন', 4500);
    return;
  }
  toast('📄 PDF তৈরি করা হচ্ছে... একটু অপেক্ষা করুন', 9000);
  await ensureFontsLoaded();
  const off = buildOffscreenClone();
  if(!off) return;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  // এই দুটো ফাংশন ক্লোনের নিজস্ব cell/row-এ সরাসরি ফন্ট-সাইজ ও উচ্চতা বসিয়ে দেয়,
  // তাই স্ক্রিনশট তোলার আগে ক্লোনটা ইতিমধ্যেই এক-পাতার সঠিক লেআউটে চলে আসে
  autofitCells(off.clone);
  stretchRowsToFillPage(off.clone);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const canvas = await html2canvas(off.clone, {scale:3, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const pageWidth = 210, pageHeight = 297;
    const imgW = pageWidth;
    const imgH = canvas.height * imgW / canvas.width;
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgW, Math.min(imgH, pageHeight));
    pdf.save(reportFileBaseName(CURRENT_MONTH) + '.pdf');
    toast('✅ PDF ডাউনলোড হয়েছে — এখন হোয়াটসঅ্যাপ খুলে ফাইলটি Attach করে পাঠাতে পারেন', 5000);
  }catch(e){
    console.error('pdf export failed', e);
    toast('⚠ PDF তৈরি করতে সমস্যা হয়েছে, আবার চেষ্টা করুন', 4500);
  }finally{
    off.wrap.remove();
  }
}

async function submitMonth(){
  if(!remarksFullyFilled(CURRENT_MONTH)){
    const proceed = confirm('⚠ এই মাসে কিছু ছুটির দিন/শুক্রবারে এখনও মন্তব্য বসানো হয়নি।\n\nআগে "🗓 Fill Remark" বাটনে চেপে ছুটিগুলো বসিয়ে নিন, তারপর জমা দিন।\n\n(তারপরও এভাবেই জমা দিতে চাইলে "OK" চাপুন, নাহলে "Cancel" চেপে আগে Fill Remark করে নিন)');
    if(!proceed) return;
  }
  STATE.submitted[CURRENT_MONTH] = new Date().toISOString();
  delete getMonthEntry(CURRENT_MONTH).activeIdx; // জমা দেওয়ার সাথে সাথে সবুজ হাইলাইট মুছে যাবে
  SAVING_IN_PROGRESS = true;
  toast('সংরক্ষণ করা হচ্ছে... একটু অপেক্ষা করুন');
  let ok = false;
  for(let attempt=1; attempt<=3 && !ok; attempt++){
    ok = await saveState();
    if(!ok && attempt<3){
      toast(`সংরক্ষণে সমস্যা হয়েছে, আবার চেষ্টা করা হচ্ছে... (${attempt}/৩)`);
      await new Promise(r=>setTimeout(r, 1200*attempt));
    }
  }
  SAVING_IN_PROGRESS = false;
  if(ok){
    const nextYm = nextMonthStr(CURRENT_MONTH);
    CURRENT_MONTH = nextYm;
    STATE.currentMonth = nextYm;
    saveState();
    renderTab();
    toast('মাসিক রিপোর্ট জমা হয়েছে ✔ — পরবর্তী মাস স্বয়ংক্রিয়ভাবে সিলেক্ট হয়েছে');
  } else {
    delete STATE.submitted[CURRENT_MONTH];
    renderTab();
    toast('⚠ ৩ বার চেষ্টা করেও সংরক্ষণ ব্যর্থ হয়েছে — নিচে কারণ দেখুন', 6000);
  }
}
async function unsubmitMonth(){
  delete STATE.submitted[CURRENT_MONTH];
  SAVING_IN_PROGRESS = true;
  await saveState();
  SAVING_IN_PROGRESS = false;

}

/* ================= স্বাক্ষর আপলোড =================
   ছবিটা ছোট করে (সর্বোচ্চ ৫০০px চওড়া) ও কমপ্রেস করে (JPEG) সংরক্ষণ করা হয়, যাতে Firestore-এ
   জায়গা কম লাগে এবং সব ডিভাইসে দ্রুত সিঙ্ক হয়। সাদা ব্যাকগ্রাউন্ড আগে থেকেই বসিয়ে দেওয়া হয়, তাই
   স্বচ্ছ (transparent) পিএনজি ছবি আপলোড করলেও কালো না হয়ে সাদা ব্যাকগ্রাউন্ডে সঠিকভাবে বসবে। */
function resizeImageToDataUrl(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('ফাইল পড়া যায়নি'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('ছবি লোড করা যায়নি'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleSignatureUpload(input){
  const file = input.files[0];

  if(!file.type.startsWith('image/')){ toast('⚠ শুধু ছবি ফাইল আপলোড করুন'); input.value=''; return; }
  try{
    toast('স্বাক্ষরের ছবি প্রসেস করা হচ্ছে...');
    const dataUrl = await resizeImageToDataUrl(file, 500, 0.85);

  }catch(e){
    console.error('signature upload failed', e);
    toast('⚠ ছবি প্রসেস করতে সমস্যা হয়েছে, আবার চেষ্টা করুন');

}

function renderTabPreservingFocus(){
  const active = document.activeElement;
  let saved = null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    saved = {id:active.id, start:active.selectionStart, end:active.selectionEnd};
  }
  renderTab();
  if(saved){
    const el = document.getElementById(saved.id);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange==='function' && saved.start!=null){
        try{ el.setSelectionRange(saved.start, saved.end); }catch(e){ /* কিছু ইনপুট টাইপ (যেমন number/date) এটা সমর্থন করে না */ }
      }
    }
  }
}

function renderBarChart(data){
  if(!data.length) return '<div class="empty">কোনো ডেটা নেই — মাসিক রিপোর্টে কর্মসূচি বসালে এখানে চার্ট দেখা যাবে</div>';
  const w=700,h=300,padL=36,padB=66,padT=26,padR=16;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const maxVal = Math.max(...data.map(d=>d.count), 1);
  const gap = chartW/data.length;
  const barW = Math.min(gap*0.6, 46);
  let bars='', labels='';
  data.forEach((d,i)=>{
    const barH = (d.count/maxVal)*chartH;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + chartH - barH;
    const lx = (x+barW/2).toFixed(1), ly = (h-padB+14).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="#2f6690" rx="3"/>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="11" text-anchor="middle" fill="#123a5e" font-weight="700">${bnNum(d.count)}</text>`;
    labels += `<text x="${lx}" y="${ly}" font-size="10" text-anchor="end" fill="#5a5648" transform="rotate(-40 ${lx} ${ly})">${d.label}</text>`;
  });
  const axisLine = `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#d8d2bd" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">${axisLine}${bars}${labels}</svg>`;
}
function renderLineChart(data){
  if(!data.length) return '<div class="empty">কোনো ডেটা নেই — মাসিক রিপোর্টে কর্মসূচি বসালে এখানে চার্ট দেখা যাবে</div>';
  const w=700,h=300,padL=36,padB=66,padT=26,padR=16;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const maxVal = Math.max(...data.map(d=>d.count), 1);
  const stepX = data.length>1 ? chartW/(data.length-1) : 0;
  const points = data.map((d,i)=>{
    const x = padL + i*stepX;
    const y = padT + chartH - (d.count/maxVal)*chartH;
    return {x,y,d};
  });
  const pathD = points.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${(padT+chartH).toFixed(1)} L ${points[0].x.toFixed(1)} ${(padT+chartH).toFixed(1)} Z`;
  const dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#b5651d"/><text x="${p.x.toFixed(1)}" y="${(p.y-10).toFixed(1)}" font-size="11" text-anchor="middle" fill="#b5651d" font-weight="700">${bnNum(p.d.count)}</text>`).join('');
  const labels = points.map(p=>{
    const lx = p.x.toFixed(1), ly = (h-padB+14).toFixed(1);
    return `<text x="${lx}" y="${ly}" font-size="10" text-anchor="end" fill="#5a5648" transform="rotate(-40 ${lx} ${ly})">${p.d.label}</text>`;
  }).join('');
  const axisLine = `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#d8d2bd" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">
    <path d="${areaD}" fill="#f6e6d6" opacity="0.6"/>
    ${axisLine}<path d="${pathD}" fill="none" stroke="#b5651d" stroke-width="2.5"/>${dots}${labels}
  </svg>`;
}
function renderPieChart(ipc, epi){
  const total = ipc+epi;
  if(total===0) return '<div class="empty">কোনো ডেটা নেই — মাসিক রিপোর্টে IPC/EPI কর্মসূচি বসালে এখানে চার্ট দেখা যাবে</div>';
  const cx=110, cy=110, r=95;
  function polarToCartesian(angleDeg){
    const rad = (angleDeg-90) * Math.PI/180;
    return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
  }
  function slicePath(startA, endA){
    if(endA-startA >= 359.999) return `M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`;
    const s = polarToCartesian(startA), e = polarToCartesian(endA);
    const largeArc = endA-startA > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)} Z`;
  }
  const ipcAngle = (ipc/total)*360;
  const ipcPct = Math.round((ipc/total)*100), epiPct = 100-ipcPct;
  return `
  <div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;">
    <svg viewBox="0 0 220 220" style="width:200px;height:200px;flex:0 0 auto;" xmlns="http://www.w3.org/2000/svg">
      <path d="${slicePath(0, ipcAngle)}" fill="#2f6690"/>
      <path d="${slicePath(ipcAngle, 360)}" fill="#b5651d"/>
      <circle cx="110" cy="110" r="52" fill="#fff"/>
      <text x="110" y="104" text-anchor="middle" font-size="12" fill="#1b2430" font-weight="600">সর্বমোট</text>
      <text x="110" y="125" text-anchor="middle" font-size="17" fill="#1b2430" font-weight="800">${bnNum(total)}</text>
    </svg>
    <div style="font-size:14px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="width:14px;height:14px;background:#2f6690;border-radius:3px;display:inline-block;"></span>
        <span>IPC — <strong>${bnNum(ipc)}</strong> (${bnNum(ipcPct)}%)</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="width:14px;height:14px;background:#b5651d;border-radius:3px;display:inline-block;"></span>
        <span>EPI — <strong>${bnNum(epi)}</strong> (${bnNum(epiPct)}%)</span>
      </div>
    </div>
  </div>`;
}

function exportBackup(){
  const dataStr = JSON.stringify(STATE, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = isoDate(new Date());
  a.href = url;
  a.download = `monthly-report-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('ব্যাকআপ ফাইল ডাউনলোড হয়েছে');
}
function triggerImport(){ document.getElementById('importFileInput').click(); }
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.worker || !imported.centerRows){ toast('ফাইলটি সঠিক ব্যাকআপ ফরম্যাটে নেই'); return; }
      if(!confirm('বর্তমান সব ডেটা মুছে ব্যাকআপ ফাইলের ডেটা বসানো হবে। নিশ্চিত?')) return;
      STATE = migrateState(imported);
      await saveState();
      toast('ব্যাকআপ থেকে ডেটা ফিরিয়ে আনা হয়েছে ✔');
      render();
    }catch(err){
      toast('ফাইলটি পড়া যায়নি — সঠিক ব্যাকআপ ফাইল কিনা দেখুন');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ইতিহাস সার্চ — এখন তিনভাবেই খোঁজা যায়: বাংলা মাসের নাম+বছর ("অক্টোবর ২০২৬"),
   মাস-বছর সংখ্যায় হাইফেন দিয়ে ("10-2026"), বা টানা সংখ্যায় ("102026") */
// প্রতিটা অক্ষর টাইপ করার পর renderTab() পুরো ট্যাব-কনটেন্ট (সার্চ বক্সসহ) নতুন করে তৈরি করে,
// যার ফলে স্বাভাবিকভাবেই কীবোর্ড ফোকাস হারিয়ে যায় (প্রথম অক্ষরের পরই "বেরিয়ে" যাওয়ার মতো লাগে)।
// তাই রি-রেন্ডারের পর সার্চ বক্সে আবার ফোকাস ও কার্সারের অবস্থান ফিরিয়ে দেওয়া হচ্ছে।
function handleHistorySearch(v){
  window._searchTerm = v;
  renderTab();
  const el = document.getElementById('historySearchInput');
  if(el){
    el.focus();
    el.setSelectionRange(el.value.length, el.value.length);
  }
}
function monthMatchesSearch(ym, rawTerm){
  const term = (rawTerm||'').trim();
  if(!term) return true;
  const [y,m] = ym.split('-').map(Number);
  const yyyy = String(y), mm = String(m).padStart(2,'0');
  // বাংলা মাসের নাম দিয়ে সরাসরি মিলানো (বাংলা বা ইংরেজি সংখ্যা — দুই রকম বছর লেখাতেই)
  const bnLabel = BN_MONTHS[m-1] + ' ' + bnNum(y);
  const enDigitLabel = BN_MONTHS[m-1] + ' ' + yyyy;
  if(bnLabel.includes(term) || enDigitLabel.includes(term)) return true;
  // বাংলা সংখ্যা টাইপ করে থাকলে সেটাকে ইংরেজি সংখ্যায় রূপান্তর
  const normTerm = term.replace(/[০-৯]/g, d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
  if(/^[0-9\-\s]+$/.test(normTerm)){
    const digits = normTerm.replace(/[^0-9]/g,'');
    if(digits){
      const candidates = [`${yyyy}${mm}`, `${mm}${yyyy}`, yyyy, mm];
      if(candidates.some(c=>c.includes(digits))) return true;
    }
  }
  return false;
}
function historyTabHTML(){
  const isViewer = CURRENT_ROLE==='viewer';
  const months = Object.keys(STATE.entries).sort().reverse();
  let searchTerm = window._searchTerm || '';
  let filtered = months.filter(ym=> monthMatchesSearch(ym, searchTerm));

  const listHTML = filtered.length ? filtered.map(ym=>{
    const [y,m]=ym.split('-').map(Number);
    const label = BN_MONTHS[m-1]+' '+bnNum(y);
    const submitted = STATE.submitted[ym];
    const entry = STATE.entries[ym];
    const filledDays = entry.rows.filter(r=>r.code && r.code!=='----').length;
    return `
    <div class="history-item">
      <div>
        <strong>${label}</strong>
        <div class="muted" style="font-size:12px;">${bnNum(filledDays)} দিন পূরণ করা হয়েছে ${submitted?' • জমা: '+new Date(submitted).toLocaleDateString('bn-BD'):''}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="openMonth('${ym}')">দেখুন</button>
        ${isViewer?'':`<button class="btn btn-danger" onclick="deleteMonthReport('${ym}')">🗑 ডিলিট</button>`}
      </div>
    </div>`;
  }).join('') : `<div class="empty">কোনো মাসের রিপোর্ট এখনো তৈরি হয়নি</div>`;

  return `
  <div class="card">
    <div class="top-bar">
      <h2 style="border:none;margin:0;">ইতিহাস ও সার্চ</h2>
      ${isViewer?'':`
      <div style="display:flex;gap:8px;">
        <button class="btn btn-gold btn-sm" onclick="exportBackup()">⬇ ব্যাকআপ ডাউনলোড</button>
        <button class="btn btn-outline btn-sm" onclick="triggerImport()">⬆ ব্যাকআপ থেকে ফিরিয়ে আনুন</button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(this)">
      </div>`}
    </div>
    ${isViewer?'':`
    <p class="hint" style="margin-top:-8px;margin-bottom:12px;">
      অন্য ফোন বা কম্পিউটারে সব ডেটা নিয়ে যেতে চাইলে: এখান থেকে "ব্যাকআপ ডাউনলোড" করে ফাইলটা Google Drive/ইমেইলে রাখুন, তারপর অন্য ডিভাইসে এই অ্যাপ খুলে "ব্যাকআপ থেকে ফিরিয়ে আনুন" চাপুন।
    </p>`}
    <div class="search-box">
      <input type="text" id="historySearchInput" style="max-width:280px;width:100%;" placeholder="মাস খুঁজুন..." value="${esc(searchTerm)}" oninput="handleHistorySearch(this.value)">
    </div>
    <p class="hint" style="margin-top:-8px;margin-bottom:12px;">
      যেকোনো একভাবে লিখে খুঁজতে পারবেন — বাংলা মাসের নাম+বছর (<b>অক্টোবর ২০২৬</b>), হাইফেন দিয়ে মাস-বছর (<b>10-2026</b>), অথবা টানা সংখ্যায় (<b>102026</b>)
    </p>
    <div class="history-list">${listHTML}</div>
  </div>
  ${grandTotalHTML()}`;
}
function openMonth(ym){ CURRENT_MONTH=ym; ACTIVE_TAB='entry'; render(); }
/* ইতিহাস থেকে কোনো মাস মুছে ফেলার পর, "পরবর্তীতে কোন মাস ডিফল্ট থাকবে" — সেটা এখন সবসময়
   ইতিহাসে বাকি থাকা সর্বশেষ জমা দেওয়া মাসের উপর ভিত্তি করে নতুন করে ঠিক করা হয় (সেই মাসের পরের মাস)।
   কোনো জমা দেওয়া মাসই না থাকলে আজকের প্রকৃত ক্যালেন্ডার মাসে ফিরে যায়। */
function recalcDefaultMonthFromHistory(){
  const submittedMonths = Object.keys(STATE.submitted).sort();
  STATE.currentMonth = submittedMonths.length
    ? nextMonthStr(submittedMonths[submittedMonths.length-1])
    : isoDate(new Date()).slice(0,7);
}
async function deleteMonthReport(ym){
  const [y,m] = ym.split('-').map(Number);
  const label = BN_MONTHS[m-1]+' '+bnNum(y);
  if(!confirm(`${label} মাসের পুরো রিপোর্ট স্থায়ীভাবে মুছে ফেলা হবে। আপনি কি নিশ্চিত?`)) return;
  delete STATE.entries[ym];
  delete STATE.submitted[ym];
  recalcDefaultMonthFromHistory();
  const ok = await saveState();
  renderTab();
  toast(ok ? `${label} মাসের রিপোর্ট মুছে ফেলা হয়েছে` : '⚠ মুছতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
}

/* পেইজের যেকোনো খালি জায়গায় (টেবিলের সারির বাইরে) ক্লিক করলে
   "সর্বশেষ এডিট করা সারি"-র সবুজ হাইলাইটটি মুছে যাবে।
   এটি শুধু স্ক্রিনে দেখানো ভিজ্যুয়াল ক্লিয়ার — ডেটা/স্টেট অপরিবর্তিত থাকে,
   তাই পরবর্তী রি-রেন্ডারে (যেমন অন্য সারি এডিট করলে বা Firebase সিঙ্ক হলে) দরকার হলে আবার দেখাবে। */
document.addEventListener('click', function(e){
  if(e.target.closest('tbody tr')) return; // টেবিলের ভেতরের ক্লিক হলে কিছু করার দরকার নেই
  document.querySelectorAll('tbody tr.active-row').forEach(tr=>tr.classList.remove('active-row'));
}, true);

/* ---------------- init ---------------- */
(async function init(){
  STATE = await loadState();
  CURRENT_MONTH = STATE.currentMonth || isoDate(new Date()).slice(0,7);
  render();
  initFirebase();
})();
</script>
